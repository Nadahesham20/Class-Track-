{% extends "layout.html" %}

{% block content %}

<h2>Add Student</h2>

<form method="POST" class="form">

    <label>
        Student Name
    </label>

    <input
        type="text"
        name="name"
        placeholder="Enter student name"
        required
    >

    <button type="submit">
        Add Student
    </button>

</form>

{% endblock %}
