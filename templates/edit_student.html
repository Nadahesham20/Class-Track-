{% extends "layout.html" %}

{% block content %}

<h2>Edit Student</h2>

<form method="POST" class="form">

    <label>
        Student Name
    </label>

    <input
        type="text"
        name="name"
        value="{{ student.name }}"
        required
    >

    <button type="submit">
        Save Changes
    </button>

</form>

{% endblock %}
