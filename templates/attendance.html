{% extends "layout.html" %}

{% block content %}

<h2>Attendance</h2>

<form method="POST">

    <label>
        Lecture Number
    </label>

    <input
        type="number"
        name="lecture"
        min="1"
        required
    >

    <table>

        <tr>

            <th>Code</th>
            <th>Student Name</th>
            <th>Present</th>

        </tr>

        {% for student in students %}

        <tr>

            <td>
                {{ student.id }}
            </td>

            <td>
                {{ student.name }}
            </td>

            <td>

                <input
                    type="checkbox"
                    name="student_{{ student.id }}"
                    value="present"
                >

            </td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <button type="submit">
        Save Attendance
    </button>

</form>

{% endblock %}
